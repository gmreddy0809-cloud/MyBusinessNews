name: Refresh and publish MyBusinessNews
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/news.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mybusinessnews-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify official RSS timestamps and company matching
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Retrieve free source-linked news
        run: python scripts/collect.py
      - name: Preserve latest news index
        run: |
          cp data/news.json "$RUNNER_TEMP/mybusinessnews-index.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp "$RUNNER_TEMP/mybusinessnews-index.json" data/news.json
            git add data/news.json
            if git diff --cached --quiet; then
              echo "News index already current"
              break
            fi
            git commit -m "chore: refresh business news index"
            if git push origin HEAD:main; then
              echo "News index committed successfully"
              break
            fi
            echo "::warning::Feed commit conflict, retrying ($attempt/3)"
            sleep 3
          done
      - name: Prepare static site
        run: |
          mkdir -p public/data
          cp index.html public/
          cp data/news.json public/data/news.json
          touch public/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
