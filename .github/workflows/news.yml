name: Refresh and publish MyBusinessNews
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/news.yml'
permissions:
  contents: write
  models: read
  pages: write
  id-token: write
concurrency:
  group: mybusinessnews-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify headline parsing (do not block news delivery)
        id: newsroom_tests
        continue-on-error: true
        timeout-minutes: 3
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Parallel half-hour news refresh (independent desk feeds)
        id: collect
        continue-on-error: true
        timeout-minutes: 12
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          MBN_SNIPPETS_PER_RUN: '0'
        run: python -u scripts/quick_refresh.py
      - name: Check news data even when a feed fails
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('data/news.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          count=len(obj.get('articles',[]))
          if count==0:raise SystemExit('ERROR: news.json contains no stories')
          print('Publishable headline count:',count)
          print('Last successful news data time:',obj.get('generated_at'))
          PY
      - name: Summarize regional, PF, Realty and Reuters feed health
        run: |
          python - <<'PY'
          import json,os
          from collections import Counter
          with open('data/news.json',encoding='utf-8') as handle:
              obj=json.load(handle)
          rows=obj.get('articles') or []
          status=obj.get('source_status') or {}
          regions=Counter(r.get('region') or 'unknown' for r in rows)
          desks=Counter(r.get('desk') or 'legacy-business' for r in rows)
          digest=[
              '## MyBusinessNews backend refresh',
              '- Generated: '+str(obj.get('generated_at')),
              '- Total saved links: '+str(len(rows)),
              '- Regional AP/TG/Hyderabad: '+str(sum(regions[k] for k in ('andhra-pradesh','telangana','hyderabad','ap-tg'))),
              '- Personal Finance desk links: '+str(desks['personal-finance']),
              '- Reuters credited links: '+str(sum('Reuters' in (r.get('source') or '') for r in rows)),
              '- Hyderabad real-estate sector links: '+str(sum((r.get('sector')=='Real Estate' and r.get('region') in ('hyderabad','telangana','ap-tg')) for r in rows)),
              '- Telugu translated headlines: '+str(sum(bool(r.get('title_te')) for r in rows))+' / '+str(len(rows)),
              '- Telugu summary snippets: '+str(sum(bool(r.get('snippet_te')) for r in rows))+' / '+str(len(rows)),
              '- Successful desks in latest run: '+str(len((status.get('quick_refresh') or {}).get('successful_desks') or [])),
              '### Collector results',
          ]
          for key in ('regional_discovery','hyderabad_business_discovery','regional_business_recovery',
                      'hyderabad_real_estate_discovery','hyderabad_mail_rss','personal_finance_discovery','reuters_discovery'):
              v=status.get(key) or {}
              digest.append('- '+key+': '+str(v.get('accepted',v.get('newly_collected','not reported')))
                            +' matches, '+str(len(v.get('warnings') or []))+' warnings')
          print('\\n'.join(digest),flush=True)
          if not any(r.get('snippet_te') for r in rows):
              print('::warning::Telugu snippet generation is disabled in this workflow; all snippets remain blank.',flush=True)
          if not any(r.get('title_te') for r in rows):
              print('::warning::No translated Telugu headlines are published; original publisher headlines are used.',flush=True)
          if not (status.get('quick_refresh') or {}).get('successful_desks'):
              print('::warning::No confirmed desk success in saved news index; inspect feed logs.',flush=True)
          path=os.environ.get('GITHUB_STEP_SUMMARY')
          if path:
              with open(path,'a',encoding='utf-8') as out:
                  out.write('\\n'.join(digest)+'\\n')
          PY
      - name: Report failing newsroom tests
        if: steps.newsroom_tests.outcome == 'failure'
        run: echo "::warning::Newsroom tests failed; inspect the parsing test step even though news collection continues."
      - name: Report news collection failures
        if: steps.collect.outcome == 'failure'
        run: echo "::warning::This run retained the last valid news index because collection did not complete."
      - name: Preserve latest news index
        run: |
          cp data/news.json "$RUNNER_TEMP/mybusinessnews-index.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            python scripts/merge_news_index.py data/news.json "$RUNNER_TEMP/mybusinessnews-index.json"
            cp "$RUNNER_TEMP/mybusinessnews-index.json" data/news.json
            git add data/news.json
            if git diff --cached --quiet; then
              echo "News index already current"
              break
            fi
            git commit -m "chore: refresh business news index"
            if git push origin HEAD:main; then
              echo "News index committed successfully"
              break
            fi
            echo "::warning::Feed commit conflict, retrying ($attempt/3)"
            sleep 3
          done
      - name: Prepare static site
        run: |
          mkdir -p public/data
          cp index.html public/
          cp data/news.json public/data/news.json
          touch public/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Wait for GitHub Pages artifact indexing
        # GitHub's deploy API can briefly report zero artifacts immediately
        # after a successful upload. Avoid intermittent production failures.
        run: sleep 18
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Retry deployment after artifact propagation
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
