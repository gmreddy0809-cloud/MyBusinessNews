name: Publish MyBusinessNews now
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-now.yml'
      - 'index.html'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mybusinessnews-pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Test deep links and F5 view restoration
        run: node tests/url-state.test.cjs
      - name: Prepare website
        run: |
          mkdir -p public/data
          cp index.html public/index.html
          if [ -f data/news.json ]; then cp data/news.json public/data/news.json; else echo '{"articles":[]}' > public/data/news.json; fi
          touch public/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
